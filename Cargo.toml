[package]
name         = "regit-daycount"
version      = "1.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "Apache-2.0"
description  = "Financial day-count fractions, market business-day calendars and date rolls in pure Rust. Checked APIs, zero dependencies, no_std, no allocation."
repository   = "https://github.com/org-regit-io/regit-daycount"
homepage     = "https://www.regit.io"
documentation = "https://docs.rs/regit-daycount"
publish      = ["crates-io"]
authors      = ["Nicolas Koenig <nicolas.koenig@regit.io>"]
keywords     = ["day-count", "calendar", "finance", "no-std", "isda"]
categories   = ["finance", "no-std::no-alloc", "mathematics"]
readme       = "README.md"
include      = [
    "/src/**",
    "/tests/**",
    "/benches/**",
    "/examples/**",
    # Keep the complete reproducible oracle without generated bytecode/caches.
    "/validation/*.py",
    "/validation/*.md",
    "/validation/*.json",
    "/validation/*.tsv",
    "/validation/*.txt",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/SPEC.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE",
    "/NOTICE",
    "/AUTHORS.md",
    "/CITATION.cff",
]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["wasm32-unknown-unknown", "thumbv7em-none-eabi"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[features]
# `calendars` includes TARGET2 / Luxembourg rule generators and static,
# sorted US / UK / JP / CH / HK / SG holiday tables. The data is pure —
# no_std-clean, no allocation — and is enabled by
# default. Disable it for a minimal build that exposes only the date primitives,
# day-count fractions, and date-roll conventions:
#   cargo build --no-default-features
default   = ["calendars"]
calendars = []

[dependencies]
# Runtime dependencies: none. The crate is `no_std`, allocation-free, and
# zero-dependency by design — see README.md and SPEC.md. Every day-count
# fraction and date-roll convention is hand-rolled from its governing standard.

[dev-dependencies]
proptest  = "1.12.0"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name    = "daycount"
harness = false

# The quickstart example is a guided end-to-end tour that uses every public
# API — including the calendar layer. It therefore only builds with the
# default `calendars` feature; under `--no-default-features` it is excluded.
[[example]]
name              = "quickstart"
required-features = ["calendars"]
